# Запуск dev:
# docker compose --env-file .env.dev up --build -d
# Запуск prod:
# docker compose --env-file .env.prod up --build -d

services:
  pctl-tests:
    build: .
    container_name: pctl-tests
    volumes:
      - ./config:/etc/pctl:ro
    environment:
      - PCTL_CONFIG=/etc/pctl/config.yml
      - PCTL_TEST_SERVER=lifeorient
    command: ["pytest", "-q"]
    profiles:
      - test

  pctl-proxy:
    build: .
    container_name: pctl-proxy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      #- ./ssh:/home/appuser/.ssh:ro
      - /home/maksim/.ssh_proxy:/home/appuser/.ssh:ro
      - ./config:/etc/pctl:ro
      #- ${PCTL_CONFIG_FILE}:/etc/pctl/config.yml:ro
      - ./logs:/var/log/pctl
    environment:
      - PCTL_DEFAULT_SSH_HOST=lifeorient
      - PCTL_API_TOKEN=dev-local-token-change-me
      - PCTL_SSH_CONFIG=/home/appuser/.ssh/config
      - PCTL_CONFIG=/etc/pctl/config.yml
      #- PCTL_CONFIG_FILE=./config/config.dev.yml
      #- PCTL_CONFIG_FILE=./config/config.prod.yml
      - PCTL_SSH_KNOWN_HOSTS=/home/appuser/.ssh/known_hosts
      #- PCTL_COMMAND_TIMEOUT_SECONDS=60
      - PCTL_AUDIT_LOG=/var/log/pctl/audit.jsonl
    restart: unless-stopped
