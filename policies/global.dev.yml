limits:
  maxStdoutBytes: 10485760
  maxStderrBytes: 1048576

rateLimit:
  minIntervalSeconds: 5

globalPolicies:
  - name: allow-df-h
    command: df
    allowedArgv:
      - ["-h"]

  - name: allow-uptime
    command: uptime
    allowedArgv:
      - []

  - name: allow-whoami
    command: whoami
    allowedArgv:
      - []

  - name: allow-sleep-100
    command: sleep
    allowedArgv:
      - ["100"]

servers:
  lifeorient:
    sshHost: lifeorient
    commandTimeoutSeconds: 120

    rateLimit:
      minIntervalSeconds: 5

    limits:
      maxStdoutBytes: 10485760
      maxStderrBytes: 1048576

    policies:
      - name: allow-ls-paths
        command: ls
        allowedFlags:
          - "-l"
          - "-a"
          - "-h"
          - "-la"
          - "-al"
          - "-lh"
          - "-hl"
          - "-lah"
          - "-lha"
          - "-alh"
          - "-ahl"
        flagsPosition: anywhere
        pathArgs:
          min: 0
          max: 2
          allowAbsolute: true
          allowRelative: true
          allowGlobs: false
          allowParentTraversal: false
          denyPrefixes:
            - "/root/.ssh"
            - "/proc"
            - "/sys"
            - "/dev"
          denyRegex:
            - "^/etc/shadow$"